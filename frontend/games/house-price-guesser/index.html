<!DOCTYPE html>
<html lang="en" class="bg-neutral-900 text-neutral-200">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Price Guesser</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#42b883',
          }
        }
      }
    }
  </script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    #app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    @media (max-height: 500px) and (orientation: landscape) { .game-header { height: 40px; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="data.json" type="application/json" id="houses-data"></script>
  <script src="script.js"></script>
</body>
</html>
