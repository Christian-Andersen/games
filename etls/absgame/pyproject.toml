[project]
name = "etl"
version = "0.1.0"
description = "ABS regional data ETL for game scoring"

requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "polars[calamine]>=1.37.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # missing-trailing-comma
  "T20",  # flake8-print
  "ERA",  # eradicate
  "D",  # docstrings
]

[tool.ruff.lint.pydocstyle]
convention = "google"
